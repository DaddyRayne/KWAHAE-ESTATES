<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle Zambezi river wave accent -->
  <path d="M 64 400 Q 160 360, 256 400 T 448 400" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 64 430 Q 160 390, 256 430 T 448 430" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="16" stroke-linecap="round"/>

  <!-- House roof -->
  <path d="M 120 250 L 256 120 L 392 250" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chimney -->
  <path d="M 330 185 L 330 145 L 360 145 L 360 215" fill="#ffffff"/>

  <!-- House body -->
  <rect x="156" y="240" width="200" height="150" rx="12" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Doorway in Gold / Copper -->
  <path d="M 226 390 L 226 295 C 226 278, 286 278, 286 295 L 286 390 Z" fill="url(#gold)"/>
  <!-- Door knob -->
  <circle cx="270" cy="340" r="5" fill="#ffffff"/>

  <!-- Windows -->
  <rect x="176" y="270" width="36" height="36" rx="6" fill="#047857"/>
  <rect x="300" y="270" width="36" height="36" rx="6" fill="#047857"/>

  <!-- Kwahae Star/Sun in gold above peak -->
  <circle cx="256" cy="95" r="14" fill="#fbbf24"/>
</svg>
